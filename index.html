<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Days Alive</title>

  <link rel="manifest" href="manifest.json" />

  <script data-goatcounter="https://daysalive-fx.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230a0a0f'/><path d='M50 22v56M28 42h44' stroke='%23c8a96e' stroke-width='8' stroke-linecap='round'/></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230a0a0f'/><path d='M50 22v56M28 42h44' stroke='%23c8a96e' stroke-width='8' stroke-linecap='round'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: rgba(255,255,255,0.08);
      --accent: #c8a96e;
      --accent2: #7eb8c8;
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.45);
      --glow: rgba(200,169,110,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', Georgia, serif; overflow: hidden; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease, transform 0.6s ease; }
    .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 50% at 20% 20%, rgba(200,169,110,0.06) 0%, transparent 60%), radial-gradient(ellipse 60% 60% at 80% 80%, rgba(126,184,200,0.05) 0%, transparent 60%); pointer-events: none; z-index: 0; }
    
    /* ONBOARDING COMPACTÉ POUR ÉVITER LE BUG DE HAUTEUR */
    #screen-onboard { padding: 1.5rem; z-index: 10; }
    .onboard-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 1.8rem 1.6rem; width: 100%; max-width: 400px; box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 60px var(--glow); position: relative; overflow: hidden; }
    .onboard-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    .onboard-logo { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.25em; color: var(--accent); text-transform: uppercase; margin-bottom: 1rem; opacity: 0.8; }
    .onboard-title { font-size: 1.35rem; font-weight: 300; line-height: 1.35; margin-bottom: 0.6rem; color: var(--text); text-align: center; }
    .onboard-title em { font-style: italic; color: var(--accent); font-weight: 400; }
    .onboard-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 1.2rem; font-weight: 300; text-align: center; }
    .lang-toggle { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
    .lang-btn { flex: 1; padding: 0.5rem; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s; }
    .lang-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
    .field { margin-bottom: 0.9rem; }
    .field label { display: block; font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.4rem; }
    .field input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 300; outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,169,110,0.1); }
    .field input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    
    /* STYLE INTERRUPTEUR NOTIFICATIONS DORÉ */
    .notify-box { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.8rem; margin-bottom: 1rem; }
    .notify-text { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(255,255,255,0.1); transition: .3s; border-radius: 20px; border: 1px solid var(--border); }
    .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: var(--muted); transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); background-color: var(--bg); }

    .btn-primary { width: 100%; padding: 0.9rem; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--accent), #d4b87a); color: #0a0a0f; font-family: 'Space Mono', monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; margin-top: 0.4rem; transition: transform 0.15s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(200,169,110,0.3); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:hover { box-shadow: 0 6px 30px rgba(200,169,110,0.45); }

    /* MAIN */
    #screen-main { z-index: 5; padding: 2rem; gap: 0; }
    .main-inner { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .greeting { text-align: center; }
    .greeting-label { font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.25em; color: var(--accent); text-transform: uppercase; opacity: 0.8; margin-bottom: 0.4rem; }
    .greeting-name { font-size: 2.2rem; font-weight: 300; letter-spacing: 0.02em; }
    .greeting-name em { font-style: italic; color: var(--accent); font-weight: 400; }
    .counter-card { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 2rem 2rem; width: 100%; text-align: center; position: relative; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 0 80px var(--glow); }
    .counter-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent); }
    .counter-card::after { content: ''; position: absolute; bottom: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(126,184,200,0.06) 0%, transparent 70%); pointer-events: none; }
    .days-number { font-family: 'Space Mono', monospace; font-size: clamp(3.2rem, 14vw, 4.6rem); font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--text); text-shadow: 0 0 40px rgba(200,169,110,0.2); margin-bottom: 0.4rem; animation: countUp 0.8s cubic-bezier(0.34,1.56,0.64,1) both; animation-delay: 0.4s; }
    .days-label { font-size: 1.1rem; font-weight: 300; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
    .stats-row { display: flex; gap: 0.8rem; justify-content: center; }
    .stat-pill { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 100px; padding: 0.45rem 0.9rem; text-align: center; }
    .stat-val { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--accent2); display: block; }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); display: block; }

    /* VERSE CARD */
    .verse-card { background: rgba(200,169,110,0.05); border: 1px solid rgba(200,169,110,0.18); border-radius: 18px; padding: 1.2rem 1.4rem; width: 100%; position: relative; }
    .verse-card::before { content: '\201C'; position: absolute; top: -0.2rem; left: 0.8rem; font-size: 3rem; color: var(--accent); opacity: 0.25; font-family: Georgia, serif; line-height: 1; }
    .verse-text { font-size: 0.98rem; font-style: italic; color: var(--text); line-height: 1.65; font-weight: 300; padding-left: 0.4rem; opacity: 0.9; }
    .verse-ref { font-family: 'Space Mono', monospace; font-size: 0.58rem; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-top: 0.7rem; opacity: 0.75; padding-left: 0.4rem; }

    /* BOTTOM */
    .bottom-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .lang-switch { font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.15em; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 100px; padding: 0.45rem 0.8rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
    .lang-switch:hover { border-color: var(--accent2); color: var(--accent2); }
    .live-dot { display: flex; align-items: center; gap: 0.4rem; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--muted); letter-spacing: 0.1em; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .btn-edit { background: transparent; border: 1px solid var(--border); border-radius: 100px; padding: 0.6rem 1.4rem; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-edit svg { width: 12px; height: 12px; }

    /* ANIMATIONS */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .anim { animation: fadeUp 0.7s ease both; }
    .anim-1 { animation-delay: 0.1s; }
    .anim-2 { animation-delay: 0.2s; }
    .anim-3 { animation-delay: 0.35s; }
    .anim-4 { animation-delay: 0.5s; }
    .anim-5 { animation-delay: 0.65s; }
    @keyframes countUp { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="screen" id="screen-onboard">
  <div class="onboard-card">
    <div class="onboard-logo">Days Alive ✦</div>
    <h1 class="onboard-title" id="ob-title">Enseigne-nous à bien <em>compter nos jours</em>, afin que nous appliquions notre cœur à la <em>sagesse</em>.</h1>
    <p class="onboard-sub" id="ob-sub">Entrez votre prénom et votre date de naissance.</p>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('fr',true)" id="btn-fr">🇫🇷 Français</button>
      <button class="lang-btn" onclick="setLang('en',true)" id="btn-en">🇬🇧 English</button>
    </div>
    <div class="field">
      <label id="ob-label-name">Prénom</label>
      <input type="text" id="input-name" placeholder="Votre prénom" autocomplete="given-name" />
    </div>
    <div class="field">
      <label id="ob-label-dob">Date de naissance</label>
      <input type="date" id="input-dob" />
    </div>

    <div class="notify-box">
      <span class="notify-text" id="notify-lbl">Rappel chaque matin à 6h GMT</span>
      <label class="switch">
        <input type="checkbox" id="notify-toggle" onchange="toggleNotifications()">
        <span class="slider"></span>
      </label>
    </div>

    <button class="btn-primary" id="btn-start" onclick="handleStart()">DÉCOUVRIR →</button>
  </div>
</div>

<div class="screen hidden" id="screen-main">
  <div class="main-inner">
    <div class="greeting anim anim-1">
      <div class="greeting-label" id="main-label">Cette journée est bénie</div>
      <div class="greeting-name" id="main-name">—</div>
    </div>
    <div class="counter-card anim anim-2">
      <div class="days-number" id="days-count">0</div>
      <div class="days-label" id="days-label">sur Terre</div>
      <div class="stats-row">
        <div class="stat-pill"><span class="stat-val" id="stat-years">—</span><span class="stat-lbl" id="stat-years-lbl">années</span></div>
        <div class="stat-pill"><span class="stat-val" id="stat-weeks">—</span><span class="stat-lbl" id="stat-weeks-lbl">semaines</span></div>
        <div class="stat-pill"><span class="stat-val" id="stat-hours">—</span><span class="stat-lbl" id="stat-hours-lbl">heures</span></div>
      </div>
    </div>
    <div class="verse-card anim anim-3">
      <div class="verse-text" id="verse-text">—</div>
      <div class="verse-ref" id="verse-ref">—</div>
    </div>
    <div class="bottom-bar anim anim-4">
      <button class="lang-switch" id="main-lang-switch" onclick="toggleLang()">EN</button>
      
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn-edit" onclick="handleShare()" style="width: 120px; justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
          <span id="btn-share-label">Partager</span>
        </button>
        <button class="btn-edit" onclick="showEdit()" style="width: 120px; justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span id="btn-edit-label">Modifier</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
