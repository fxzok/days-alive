    notify_lbl: 'Reminder every morning at 6am GMT'
  }
};

// ─── ÉTAT DE L'APPLICATION ────────────────────────────────────────
let lang = 'fr';
let userData = { name: '', dob: '', notifications: false };
let ticker;
let scheduleTimeout;

// ─── ALGORITHME DE CALCUL DE SÉLECTION DU VERSET BASÉ SUR GMT ─────────────
function getDailyVerse(name) {
  const today = new Date();
  const dateStr = today.getUTCFullYear() + '' + (today.getUTCMonth()+1) + '' + today.getUTCDate();
  let hash = 0;
  const seed = name.toLowerCase() + dateStr;
  for (let i = 0; i < seed.length; i++) {
    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
    hash |= 0;
  }
  const idx = Math.abs(hash) % VERSES.length;
  return VERSES[idx];
}

// ─── INITIALISATION ET ENREGISTREMENT DU SERVICE WORKER DE SÉCURITÉ PWA ───
function init() {
// NETTOYAGE DU PETIT "1" ROUGE AU DÉMARRAGE
  if ('clearAppBadge' in navigator) {
    navigator.clearAppBadge().catch(() => {});
  }
  const saved = localStorage.getItem('daysalive_user');
  const savedLang = localStorage.getItem('daysalive_lang');
  if (savedLang) lang = savedLang;
  applyLangToOnboard();
  
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  
  if (saved) { 
    userData = JSON.parse(saved);
    const toggle = document.getElementById('notify-toggle');
    if (toggle) toggle.checked = userData.notifications || false;
    showMain(); 
    checkAndTrigger6AMNotification();
  }
// VIDE LE TIROIR DES NOTIFICATIONS POUR EFFACER LE POINT ROUGE SUR ANDROID
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => {
      if (reg.getNotifications) {
        reg.getNotifications().then(notifs => {
          notifs.forEach(n => n.close());
        });
      }
    });
  }
}

// ─── COMMUTATEUR DYNAMIQUE DE LANGUES ──────────────────────────────────────
function setLang(l, fromOnboard) {
  lang = l;
  localStorage.setItem('daysalive_lang', l);
  applyLangToOnboard();
  if (!fromOnboard) applyLangToMain();
}
function toggleLang() { setLang(lang === 'fr' ? 'en' : 'fr', false); }

function applyLangToOnboard() {
  const t = T[lang];
  document.getElementById('ob-title').innerHTML = t.ob_title;
  document.getElementById('ob-sub').textContent = t.ob_sub;
  document.getElementById('ob-label-name').textContent = t.ob_label_name;
  document.getElementById('ob-label-dob').textContent = t.ob_label_dob;
  document.getElementById('input-name').placeholder = t.ob_placeholder_name;
  document.getElementById('btn-start').textContent = t.ob_btn;
  document.getElementById('notify-lbl').textContent = t.notify_lbl;
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
}

function applyLangToMain() {
  if (!userData.name) return;
  const t = T[lang];
  document.getElementById('main-label').textContent = t.main_label;
  document.getElementById('main-name').innerHTML = '<em>' + userData.name.charAt(0).toUpperCase() + userData.name.slice(1) + '</em>';
  document.getElementById('days-label').textContent = t.days_label;
  document.getElementById('stat-years-lbl').textContent = t.years;
  document.getElementById('stat-weeks-lbl').textContent = t.weeks;
  document.getElementById('stat-hours-lbl').textContent = t.hours;
  document.getElementById('btn-edit-label').textContent = t.edit;
  document.getElementById('btn-share-label').textContent = t.share;
  document.getElementById('main-lang-switch').textContent = t.lang_switch;
  updateStats();
  updateVerse();
}

// ─── ENGINE LOGIQUE DE PLANIFICATION AUTOMATIQUE À 6H00 GMT ─────────────────
function toggleNotifications() {
  const isChecked = document.getElementById('notify-toggle').checked;
  if (isChecked) {
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        userData.notifications = true;
        saveUserData();
        planNext6AMNotification();
      } else {
        document.getElementById('notify-toggle').checked = false;
        userData.notifications = false;
        saveUserData();
      }
    });
  } else {
    userData.notifications = false;
    saveUserData();
    if (scheduleTimeout) clearTimeout(scheduleTimeout);
  }
}

function saveUserData() {
  localStorage.setItem('daysalive_user', JSON.stringify(userData));
}

function planNext6AMNotification() {
  if (!userData.notifications || Notification.permission !== 'granted') return;
  if (scheduleTimeout) clearTimeout(scheduleTimeout);

  const now = new Date();
  let next6AM = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 6, 0, 0, 0));
  
  if (now >= next6AM) next6AM.setUTCDate(next6AM.getUTCDate() + 1);

  const msToWait = next6AM - now;
  scheduleTimeout = setTimeout(() => {
    sendDailyNotification();
    planNext6AMNotification();
  }, msToWait);
}

function checkAndTrigger6AMNotification() {
  if (!userData.notifications || Notification.permission !== 'granted') return;

  const now = new Date();
  const todayStr = now.getUTCFullYear() + '-' + (now.getUTCMonth()+1) + '-' + now.getUTCDate();
  const lastTriggered = localStorage.getItem('daysalive_last_notify');

  if (now.getUTCHours() >= 6 && lastTriggered !== todayStr) {
    sendDailyNotification();
  }
  planNext6AMNotification();
}

// ALERTE VERTICALE ULTRA-PERSONNALISÉE COMME CONFIGURÉE ET DEMANDÉE
function sendDailyNotification() {
  const v = getDailyVerse(userData.name);
  const dob = new Date(userData.dob);
  const now = new Date();
  const diffMs = now - dob;
  const days = Math.floor(diffMs / 86400000);
  
  const capitalizedName = userData.name.charAt(0).toUpperCase() + userData.name.slice(1);
  
  // Le Titre principal devient l'affirmation divine
  const title = lang === 'fr' ? "Cette journée est bénie ✨" : "This day is blessed ✨";

  // Agencement vertical précis (\n effectue un saut de ligne sur l'écran du mobile)
  const body = lang === 'fr' 
    ? `${capitalizedName}\nJour ${days.toLocaleString()} sur Terre\n\n"${v.fr}" — ${v.rfr}`
    : `${capitalizedName}\nDay ${days.toLocaleString()} on Earth\n\n"${v.en}" — ${v.ren}`;

  const options = {
    body: body,
    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="%230a0a0f"/><path d="M50 22v56M28 42h44" stroke="%23c8a96e" stroke-width="8" stroke-linecap="round"/></svg>'
  };

  // Traitement sécurisé pour Android et iOS
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.ready.then(reg => reg.showNotification(title, options));
  } else {
    new Notification(title, options);
  }

  const todayStr = now.getUTCFullYear() + '-' + (now.getUTCMonth()+1) + '-' + now.getUTCDate();
  localStorage.setItem('daysalive_last_notify', todayStr);
}

// ─── ACTIVATION DE L'ONBOARDING ET DE SA VEILLE ─────────────────────────
function handleStart() {
  const name = document.getElementById('input-name').value.trim();
  const dob = document.getElementById('input-dob').value;
  if (!name || !dob) {
    const input = !name ? document.getElementById('input-name') : document.getElementById('input-dob');
    input.style.borderColor = '#e05555';
    input.style.boxShadow = '0 0 0 3px rgba(224,85,85,0.15)';
    setTimeout(() => { input.style.borderColor = ''; input.style.boxShadow = ''; }, 2000);
    return;
  }
  userData = { name, dob, notifications: document.getElementById('notify-toggle').checked };
  saveUserData();
  showMain();
  checkAndTrigger6AMNotification();
}

// ─── AFFICHAGE ET RÉINITIALISATION DES ANIMATIONS ─────────────────────────
function showMain() {
  document.getElementById('screen-onboard').classList.add('hidden');
  const main = document.getElementById('screen-main');
  main.classList.remove('hidden');
  main.querySelectorAll('.anim').forEach(el => {
    el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
  });
  const dn = document.getElementById('days-count');
  dn.style.animation = 'none'; dn.offsetHeight; dn.style.animation = '';
  applyLangToMain();
  if (ticker) clearInterval(ticker);
  ticker = setInterval(updateStats, 1000);
}

// ─── RAFFRAICHISSEMENT DES CHIFFRES TEMPORELS (SANS DÉCIMALES) ─────────────
function updateStats() {
  const dob = new Date(userData.dob);
  const now = new Date();
  const diffMs = now - dob;
  const days = Math.floor(diffMs / 86400000);
  const years = Math.floor(diffMs / (86400000 * 365.25));
  const weeks = Math.floor(diffMs / (86400000 * 7));
  const hours = Math.floor(diffMs / 3600000);
  document.getElementById('days-count').textContent = days.toLocaleString();
  document.getElementById('stat-years').textContent = years;
  document.getElementById('stat-weeks').textContent = weeks.toLocaleString();
  document.getElementById('stat-hours').textContent = hours.toLocaleString();
}

function updateVerse() {
  const v = getDailyVerse(userData.name);
  if (lang === 'fr') {
    document.getElementById('verse-text').textContent = v.fr;
    document.getElementById('verse-ref').textContent = '— ' + v.rfr;
  } else {
    document.getElementById('verse-text').textContent = v.en;
    document.getElementById('verse-ref').textContent = '— ' + v.ren;
  }
}

// ─── ACCÈS AU CONTEXTE INTERNE VIA L'ÉCRAN RE-ÉDITION ─────────────────────
function showEdit() {
  document.getElementById('screen-main').classList.add('hidden');
  document.getElementById('screen-onboard').classList.remove('hidden');
  document.getElementById('input-name').value = userData.name;
  document.getElementById('input-dob').value = userData.dob;
  document.getElementById('notify-toggle').checked = userData.notifications || false;
  if (ticker) clearInterval(ticker);
}

init();
// FONCTION DE CAPTURE PHOTO EN COPIE CONFORME SÉCURISÉE
function handleShare() {
  const realDaysCount = document.getElementById('days-count');
  const exactFontSize = window.getComputedStyle(realDaysCount).fontSize;
  const realWidth = window.innerWidth;
  const realHeight = window.innerHeight;

  // On capture l'élément conteneur complet pour préserver la silhouette et les halos de fond
  const target = document.getElementById('screen-main');

  html2canvas(target, {
    width: realWidth,
    height: realHeight,
    windowWidth: realWidth,
    windowHeight: realHeight,
    backgroundColor: '#0a0a0f', 
    scale: 2, // Haute Définition
    useCORS: true,
    onclone: (clonedDoc) => {
      // Masquage absolu et temporaire de la barre inférieure sur la photo
      const clonedBottomBar = clonedDoc.querySelector('.bottom-bar');
      if (clonedBottomBar) {
        clonedBottomBar.style.setProperty('display', 'none', 'important');
      }

      // On fige toutes les animations (y compris le compteur .days-number) pour rendre tout visible
      clonedDoc.querySelectorAll('.anim, .days-number').forEach(el => {
        el.style.animation = 'none';
        el.style.opacity = '1';
        el.style.transform = 'none';
      });

      // On applique au chiffre clonant la taille exacte calculée par l'écran du mobile
      const clonedDaysCount = clonedDoc.getElementById('days-count');
      if (clonedDaysCount) {
        clonedDaysCount.style.fontSize = exactFontSize;
        clonedDaysCount.style.color = '#f0ede8';
      }

      // Consolidation générale des couleurs pour la capture
      const mainName = clonedDoc.getElementById('main-name');
      const mainLabel = clonedDoc.getElementById('main-label');
      const daysLabel = clonedDoc.getElementById('days-label');
      const verseText = clonedDoc.getElementById('verse-text');
      const verseRef = clonedDoc.getElementById('verse-ref');

      if (mainLabel) mainLabel.style.color = '#c8a96e';
      if (daysLabel) daysLabel.style.color = 'rgba(240,237,232,0.45)';
      if (verseText) verseText.style.color = '#f0ede8';
      if (verseRef) verseRef.style.color = '#c8a96e';
      if (mainName) {
        mainName.style.color = '#f0ede8';
        const em = mainName.querySelector('em');
        if (em) em.style.color = '#c8a96e';
      }

      const clonedScreen = clonedDoc.getElementById('screen-main');
      if (clonedScreen) {
        clonedScreen.style.background = "#0a0a0f radial-gradient(ellipse 80% 50% at 20% 20%, rgba(200,169,110,0.06) 0%, transparent 60%), radial-gradient(ellipse 60% 60% at 80% 80%, rgba(126,184,200,0.05) 0%, transparent 60%)";
      }

      clonedDoc.querySelectorAll('.counter-card').forEach(el => {
        el.style.backgroundColor = '#12121a';
        el.style.borderColor = 'rgba(255,255,255,0.08)';
      });
      clonedDoc.querySelectorAll('.verse-card').forEach(el => {
        el.style.backgroundColor = 'rgba(200,169,110,0.05)';
        el.style.borderColor = 'rgba(200,169,110,0.18)';
      });
      clonedDoc.querySelectorAll('.stat-pill').forEach(el => {
        el.style.backgroundColor = 'rgba(255,255,255,0.04)';
        el.style.borderColor = 'rgba(255,255,255,0.08)';
      });
      clonedDoc.querySelectorAll('.stat-val').forEach(el => el.style.color = '#7eb8c8');
      clonedDoc.querySelectorAll('.stat-lbl').forEach(el => el.style.color = 'rgba(240,237,232,0.45)');
    }
  }).then(canvas => {
    canvas.toBlob(blob => {
      if (!blob) return;
      const file = new File([blob], 'daysalive-poster.png', { type: 'image/png' });
      const name = userData.name.charAt(0).toUpperCase() + userData.name.slice(1);
      const days = document.getElementById('days-count').textContent;

      const shareText = lang === 'fr' 
        ? `✨ *Days Alive* ✨\n\n${name} fête aujourd'hui ses ${days} jours sur Terre. 🎉\nIl compte ses jours afin d'appliquer son cœur à la sagesse (Psaume 90:12). 🙏\n\nTu peux le faire toi également en cliquant sur ce lien :`
        : `✨ *Days Alive* ✨\n\n${name} is celebrating ${days} days on Earth today. 🎉\nLearning to number their days to apply their heart unto wisdom (Psalm 90:12). 🙏\n\nCalculate your days too by clicking this link:`;

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: 'Days Alive',
          text: shareText + " " + window.location.href
        }).catch(() => {});
      } else if (navigator.share) {
        navigator.share({
          title: 'Days Alive',
          text: shareText,
          url: window.location.href
        }).catch(() => {});
      } else {
        const encodedText = encodeURIComponent(shareText + " " + window.location.href);
        window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
      }
    }, 'image/png');
  }).catch(() => {});
}
