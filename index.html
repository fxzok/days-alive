  },
  {
    fr: "Béni soit Dieu, le Père de notre Seigneur Jésus-Christ, le Père des miséricordes et le Dieu de toute consolation !", rfr: "2 Corinthiens 1:3",
    en: "Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort.", ren: "2 Corinthians 1:3"
  },
  {
    fr: "Si tu me bénis et que tu étends mes limites, si ta main est avec moi, et si tu me préserves du malheur, en sorte que je ne sois pas dans la souffrance !... Et Dieu accorda ce qu'il avait demandé.", rfr: "1 Chroniques 4:10",
    en: "Oh that thou wouldest bless me indeed, and enlarge my coast, and that thine hand might be with me, and that thou wouldest keep me from evil... And God granted him that which he requested.", ren: "1 Chronicles 4:10"
  },
  {
    fr: "Fortifiez-vous et que votre cœur s'affermisse, vous tous qui espérez en l'Éternel !", rfr: "Psaume 31:25",
    en: "Be of good courage, and he shall strengthen your heart, all ye that hope in the Lord.", ren: "Psalm 31:24"
  },
  {
    fr: "Il ne craint point les mauvaises nouvelles ; son cœur est ferme, confiant en l'Éternel.", rfr: "Psaume 112:7",
    en: "He shall not be afraid of evil tidings: his heart is fixed, trusting in the Lord.", ren: "Psalm 112:7"
  },
  {
    fr: "Que l'Éternel t'exauce au jour de la détresse, que le nom du Dieu de Jacob te protège ! Qu'il t'envoie du secours de son sanctuaire.", rfr: "Psaume 20:2-3",
    en: "The Lord hear thee in the day of trouble; the name of the God of Jacob defend thee; Send thee help from the sanctuary.", ren: "Psalm 20:1-2"
  },
  {
    fr: "Qu'il te donne ce que ton cœur désire, et qu'il accomplisse tous tes desseins !", rfr: "Psaume 20:5",
    en: "Grant thee according to thine own heart, and fulfil all thy counsel.", ren: "Psalm 20:4"
  },
  {
    fr: "Voici, je suis avec toi, je te garderai partout où tu iras... car je ne t'abandonnerai point que je n'aie exécuté ce que je te promets.", rfr: "Genèse 28:15",
    en: "And, behold, I am with thee, and will keep thee in all places whither thou goest... for I will not leave thee, until I have done that which I have spoken to thee of.", ren: "Genesis 28:15"
  },
  {
    fr: "Il donne de la force à celui qui est fatigué, et il augmente la vigueur de celui qui tombe en défaillance.", rfr: "Ésaïe 40:29",
    en: "He giveth power to the faint; and to them that have no might he increaseth strength.", ren: "Isaiah 40:29"
  },
  {
    fr: "Remets ton sort à l'Éternel, et il te soutiendra, il ne laissera jamais chanceler le juste.", rfr: "Psaume 55:23",
    en: "Cast thy burden upon the Lord, and he shall sustain thee: he shall never suffer the righteous to be moved.", ren: "Psalm 55:22"
  },
  {
    fr: "Je t'instruirai et te montrerai la voie que tu dois suivre ; je te conseillerai, j'aurai le regard sur toi.", rfr: "Psaume 32:8",
    en: "I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.", ren: "Psalm 32:8"
  },
  {
    fr: "Jusqu'à votre vieillesse je serai le même, jusqu'à vos cheveux blancs je vous soutiendrai ; je l'ai fait, et je veux encore vous porter, vous soutenir et vous sauver.", rfr: "Ésaïe 46:4",
    en: "And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.", ren: "Isaiah 46:4"
  },
  {
    fr: "Oui, mon âme, confie-toi en Dieu ! Car de lui vient mon espérance.", rfr: "Psaume 62:6",
    en: "My soul, wait thou only upon God; for my expectation is from him.", ren: "Psalm 62:5"
  },
  {
    fr: "Voyez quel amour le Père nous a témoigné, pour que nous soyons appelés enfants de Dieu ! Et nous le sommes.", rfr: "1 Jean 3:1",
    en: "Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God.", ren: "1 John 3:1"
  },
  {
    fr: "Que votre cœur ne se trouble point. Croyez en Dieu, et croyez en moi.", rfr: "Jean 14:1",
    en: "Let not your heart be troubled: ye believe in God, believe also in me.", ren: "John 14:1"
  },
  {
    fr: "L'Éternel est près de tous ceux qui l'invoquent, de tous ceux qui l'invoquent avec sincérité.", rfr: "Psaume 145:18",
    en: "The Lord is nigh unto all them that call upon him, to all that call upon him in truth.", ren: "Psalm 145:18"
  },
  {
    fr: "Tout don parfait descend d'en haut, du Père des lumières, chez lequel il n'y a ni changement ni ombre de variation.", rfr: "Jacques 1:17",
    en: "Every good gift and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.", ren: "James 1:17"
  },
  {
    fr: "Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours !", rfr: "Psaume 118:1",
    en: "O give thanks unto the Lord; for he is good: because his mercy endureth for ever.", ren: "Psalm 118:1"
  },
  {
    fr: "Voici, Dieu est mon délivreur, je serai plein de confiance, et je n'aurai pas de crainte ; car l'Éternel est ma force et le sujet de mes louanges.", rfr: "Ésaïe 12:2",
    en: "Behold, God is my salvation; I will trust, and not be afraid: for the Lord Jehovah is my strength and my song.", ren: "Isaiah 12:2"
  },
  {
    fr: "Car je suis l'Éternel, ton Dieu, qui fortifie ta droite, qui te dis : Ne crains rien, je viens à ton secours.", rfr: "Ésaïe 41:13",
    en: "For I the Lord thy God will hold thy right hand, saying unto thee, Fear not; I will help thee.", ren: "Isaiah 41:13"
  },
  {
    fr: "Ne les crains point, car je suis avec toi pour te délivrer, dit l'Éternel.", rfr: "Jérémie 1:8",
    en: "Be not afraid of their faces: for I am with thee to deliver thee, saith the Lord.", ren: "Jeremiah 1:8"
  },
  {
    fr: "L'Éternel est un refuge pour l'opprimé, un refuge au temps de la détresse.", rfr: "Psaume 9:10",
    en: "The Lord also will be a refuge for the oppressed, a refuge in times of trouble.", ren: "Psalm 9:9"
  },
  {
    fr: "Quand un malheureux crie, l'Éternel entend, et il le sauve de toutes ses détresses.", rfr: "Psaume 34:7",
    en: "This poor man cried, and the Lord heard him, and saved him out of all his troubles.", ren: "Psalm 34:6"
  },
  {
    fr: "Car ce n'est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d'amour et de sagesse.", rfr: "2 Timothée 1:7",
    en: "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", ren: "2 Timothy 1:7"
  },
  {
    fr: "L'Éternel est ma force et mon bouclier ; en lui mon cœur se confie, et je suis secouru ; j'ai de la joie au cœur, et je le célèbre par mes chants.", rfr: "Psaume 28:7",
    en: "The Lord is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth.", ren: "Psalm 28:7"
  },
  {
    fr: "Consolez, consolez mon peuple, dit votre Dieu.", rfr: "Ésaïe 40:1",
    en: "Comfort ye, comfort ye my people, saith your God.", ren: "Isaiah 40:1"
  },
  {
    fr: "Car sa colère dure un instant, mais sa grâce toute la vie ; le soir arrivent les pleurs, et le matin l'allégresse.", rfr: "Psaume 30:6",
    en: "For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.", ren: "Psalm 30:5"
  },
  {
    fr: "L'ange de l'Éternel campe autour de ceux qui le craignent, et il les arrache au danger.", rfr: "Psaume 34:8",
    en: "The angel of the Lord encampeth round about them that fear him, and delivereth them.", ren: "Psalm 34:7"
  },
  {
    fr: "L'Éternel marchera lui-même devant toi, il sera lui-même avec toi, il ne te délaissera point, il ne t'abandonnera point ; ne crains point, et ne t'effraie point.", rfr: "Deutéronome 31:8",
    en: "And the Lord, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.", ren: "Deuteronomy 31:8"
  },
  {
    fr: "Le Dieu de toute grâce, qui vous a appelés en Jésus-Christ à sa gloire éternelle... vous perfectionnera lui-même, vous affermira, vous fortifiera, vous rendra inébranlables.", rfr: "1 Pierre 5:10",
    en: "But the God of all grace, who hath called us unto his eternal glory by Christ Jesus... make you perfect, stablish, strengthen, settle you.", ren: "1 Peter 5:10"
  },
  {
    fr: "L'Éternel est bon, il répand sa protection au jour de la souffrance ; il connaît ceux qui espèrent en lui.", rfr: "Nahum 1:7",
    en: "The Lord is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", ren: "Nahum 1:7"
  },
  {
    fr: "Ne t'ai-je pas donné cet ordre : Fortifie-toi et prends courage ? Ne t'effraie point et ne t'épouvante point, car l'Éternel, ton Dieu, est avec toi.", rfr: "Josué 1:9",
    en: "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the Lord thy God is with thee.", ren: "Joshua 1:9"
  },
  {
    fr: "Le Dieu de paix écrasera bientôt Satan sous vos pieds. Que la grâce de notre Seigneur Jésus-Christ soit avec vous !", rfr: "Romains 16:20",
    en: "And the God of peace shall bruise Satan under your feet shortly. The grace of our Lord Jesus Christ be with you. Amen.", ren: "Romans 16:20"
  },
  {
    fr: "L'Éternel est mon berger : je ne manquerai de rien. Il me fait reposer dans de verts pâturages, il me dirige près des eaux paisibles.", rfr: "Psaume 23:1-2",
    en: "The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters.", ren: "Psalm 23:1-2"
  },
  {
    fr: "Car là où deux ou trois sont assemblés en mon nom, je suis au milieu d'eux.", rfr: "Matthieu 18:20",
    en: "For where two or three are gathered together in my name, there am I in the midst of them.", ren: "Matthew 18:20"
  },
{
    fr: "Il ne permettra pas que ton pied chancelle ; celui qui te garde ne sommeillera point.", rfr: "Psaume 121:3",
    en: "He will not suffer thy foot to be moved: he that keepeth thee will not slumber.", ren: "Psalm 121:3"
  },
  {
    fr: "L'Éternel est celui qui te garde, l'Éternel est ton ombre à ta main droite.", rfr: "Psaume 121:5",
    en: "The Lord is thy keeper: the Lord is thy shade upon thy right hand.", ren: "Psalm 121:5"
  },
  {
    fr: "Je dis à l'Éternel : Mon refuge et ma forteresse, mon Dieu en qui je me confie !", rfr: "Psaume 91:2",
    en: "I will say of the Lord, He is my refuge and my fortress: my God; in him will I trust.", ren: "Psalm 91:2"
  },
  {
    fr: "Il te couvrira de ses plumes, et tu trouveras un refuge sous ses ailes ; sa fidélité est un bouclier et une cuirasse.", rfr: "Psaume 91:4",
    en: "He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.", ren: "Psalm 91:4"
  },
  {
    fr: "Car il donnera ordre à ses anges de te garder dans toutes tes voies.", rfr: "Psaume 91:11",
    en: "For he shall give his angels charge over thee, to keep thee in all thy ways.", ren: "Psalm 91:11"
  },
  {
    fr: "Puisqu'il m'aime, je le délivrerai ; je le protégerai, puisqu'il connaît mon nom. Il m'invoquera, et je lui répondrai.", rfr: "Psaume 91:14-15",
    en: "Because he hath set his love upon me, therefore will I deliver him: I will set him on high, because he hath known my name. He shall call upon me, and I will answer him.", ren: "Psalm 91:14-15"
  },
  {
    fr: "Ne le sais-tu pas ? ne l'as-tu pas appris ? C'est le Dieu d'éternité, l'Éternel, qui a créé les extrémités de la terre ; il ne se fatigue point, il ne se lasse point.", rfr: "Ésaïe 40:28",
    en: "Hast thou not known? hast thou not heard, that the everlasting God, the Lord, the Creator of the ends of the earth, fainteth not, neither is weary?", ren: "Isaiah 40:28"
  },
  {
    fr: "Voici, je vais faire une chose nouvelle, sur le point de paraître : ne la connaîtrez-vous pas ? Je mettrai un chemin dans le désert, et des fleuves dans la solitude.", rfr: "Ésaïe 43:19",
    en: "Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.", ren: "Isaiah 43:19"
  },
  {
    fr: "Je marcherai devant toi, j'aplanirai les chemins montueux, je romprai les portes d'airain, et je briserai les verrous de fer.", rfr: "Ésaïe 45:2",
    en: "I will go before thee, and make the crooked places straight: I will break in pieces the gates of brass, and cut in sunder the bars of iron.", ren: "Isaiah 45:2"
  },
  {
    fr: "Je te donnerai des trésors cachés, des richesses enfouies, afin que tu saches que je suis l'Éternel qui t'appelle par ton nom.", rfr: "Ésaïe 45:3",
    en: "And I will give thee the treasures of darkness, and hidden riches of secret places, that thou mayest know that I, the Lord, which call thee by thy name.", ren: "Isaiah 45:3"
  },
  {
    fr: "Une femme oublie-t-elle l'enfant qu'elle allaite ?... Quand elle l'oublierait, moi je ne t'oublierai point. Voici, je t'ai gravé sur les paumes de mes mains.", rfr: "Ésaïe 49:15-16",
    en: "Can a woman forget her sucking child?... yea, they may forget, yet will I not forget thee. Behold, I have graven thee upon the palms of my hands.", ren: "Isaiah 49:15-16"
  },
  {
    fr: "Ainsi en est-il de ma parole, qui sort de ma bouche : elle ne retourne point à moi sans effet, sans avoir exécuté ma volonté et accompli mes desseins.", rfr: "Ésaïe 55:11",
    en: "So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please.", ren: "Isaiah 55:11"
  },
  {
    fr: "Ils te feront la guerre, mais ils ne te vaincront pas ; car je suis avec toi pour du délivrer, dit l'Éternel.", rfr: "Jérémie 1:19",
    en: "And they shall fight against thee; but they shall not prevail against thee; for I am with thee, saith the Lord, to deliver thee.", ren: "Jeremiah 1:19"
  },
  {
    fr: "Invoque-moi, et je te répondrai ; je t'annoncerai de grandes choses, des choses cachées, que tu ne connais pas.", rfr: "Jérémie 33:3",
    en: "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", ren: "Jeremiah 33:3"
  },
  {
    fr: "Ne vous inquiétez donc point, et ne dites pas : Que mangerons-nous ? ou qu'boirons-nous ?... Votre Père céleste sait que vous en avez besoin.", rfr: "Matthieu 6:31-32",
    en: "Therefore take no thought, saying, What shall we eat? or, What shall we drink?... for your heavenly Father knoweth that ye have need of all these things.", ren: "Matthew 6:31-32"
  },
  {
    fr: "Et même les cheveux de votre tête sont tous comptés. Ne craignez donc point : vous valez plus que beaucoup de moineaux.", rfr: "Matthieu 10:30-31",
    en: "But the very hairs of your head are all numbered. Fear ye not therefore, ye are of more value than many sparrows.", ren: "Matthew 10:30-31"
  },
  {
    fr: "Jésus lui dit : Si tu peux !... Tout est possible à celui qui croit.", rfr: "Marc 9:23",
    en: "Jesus said unto him, If thou canst believe, all things are possible to him that believeth.", ren: "Mark 9:23"
  },
  {
    fr: "C'est pourquoi je vous dis : Tout ce que vous demanderez en priant, croyez que vous l'avez reçu, et vous le verrez s'accomplir.", rfr: "Marc 11:24",
    en: "Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.", ren: "Mark 11:24"
  },
  {
    fr: "Et moi, je vous dis : Demandez, et l'on vous donnera ; cherchez, et vous trouverez ; frappez, et l'on vous ouvrira.", rfr: "Luc 11:9",
    en: "And I say unto you, Ask, and it shall be given you; seek, and you shall find; knock, and it shall be opened unto you.", ren: "Luke 11:9"
  },
  {
    fr: "Ne crains point, petit troupeau ; car votre Père a trouvé bon de vous donner le royaume.", rfr: "Luc 12:32",
    en: "Fear not, little flock; for it is your Father's good pleasure to give you the kingdom.", ren: "Luke 12:32"
  },
  {
    fr: "Je leur donne la vie éternelle ; et elles ne périront jamais, et personne ne les ravira de ma main.", rfr: "Jean 10:28",
    en: "And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand.", ren: "John 10:28"
  },
  {
    fr: "Je ne vous laisserai pas orphelins, je viendrai à vous.", rfr: "Jean 14:18",
    en: "I will not leave you comfortless: I will come to you.", ren: "John 14:18"
  },
  {
    fr: "Si vous demeurez en moi, et que mes paroles demeurent en vous, demandez tout ce que vous voudrez, et cela vous sera accordé.", rfr: "Jean 15:7",
    en: "If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you.", ren: "John 15:7"
  },
  {
    fr: "Vous donc aussi, vous êtes maintenant dans la tristesse ; mais je vous reverrai, et votre cœur se réjouira, et nul ne vous ravira votre joie.", rfr: "Jean 16:22",
    en: "And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you.", ren: "John 16:22"
  },
  {
    fr: "Il n'y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ.", rfr: "Romains 8:1",
    en: "There is therefore now no condemnation to them which are in Christ Jesus.", ren: "Romans 8:1"
  },
  {
    fr: "J'estime que les souffrances du temps présent ne sauraient être comparées à la gloire à venir qui sera révélée pour nous.", rfr: "Romains 8:18",
    en: "For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.", ren: "Romans 8:18"
  },
  {
    fr: "Lui qui n'a point épargné son propre Fils, mais qui l'a livré pour nous tous, comment ne nous donnera-t-il pas aussi toutes choses avec lui ?", rfr: "Romains 8:32",
    en: "He that spared not his own Son, but delivered him up for us all, how shall he not with him also freely give us all things?", ren: "Romans 8:32"
  },
  {
    fr: "Mais dans toutes ces choses nous sommes plus que vainqueurs par celui qui nous a aimés.", rfr: "Romains 8:37",
    en: "Nay, in all these things we are more than conquerors through him that loved us.", ren: "Romans 8:37"
  },
  {
    fr: "Or, tout ce qui a été écrit d'avance l'a été pour notre instruction, afin que, par la patience, et par la consolation que donnent les Écritures, nous possédions l'espérance.", rfr: "Romains 15:4",
    en: "For whatsoever things were written aforetime were written for our learning, that we through patience and comfort of the scriptures might have hope.", ren: "Romans 15:4"
  },
  {
    fr: "Ce sont des choses que l'œil n'a point vues, que l'oreille n'a point entendues, et qui ne sont point montées au cœur de l'homme, des choses que Dieu a préparées pour ceux qui l'aiment.", rfr: "1 Corinthiens 2:9",
    en: "Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.", ren: "1 Corporation 2:9"
  },
  {
    fr: "Dieu est fidèle, et il ne permettra pas que vous soyez tentés au-delà de vos forces ; mais avec la tentation il préparera aussi le moyen d'en sortir, afin que vous puissiez la supporter.", rfr: "1 Corinthiens 10:13",
    en: "God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape.", ren: "1 Corinthians 10:13"
  },
  {
    fr: "Mais grâces soient rendues à Dieu, qui nous donne la victoire par notre Seigneur Jésus-Christ !", rfr: "1 Corinthiens 15:57",
    en: "But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", ren: "1 Corinthians 15:57"
  },
  {
    fr: "C'est pourquoi nous ne perdons pas courage. Et lors même que notre homme extérieur se détruit, notre homme intérieur se renouvelle de jour en jour.", rfr: "2 Corinthiens 4:16",
    en: "For which cause we faint not; but though our outward man perish, yet the inward man is renewed day by day.", ren: "2 Corinthians 4:16"
  },
  {
    fr: "Et Dieu peut vous combler de toutes sortes de grâces, afin que, possédant toujours en toutes choses de quoi satisfaire à vos besoins, vous ayez encore en abondance pour toute bonne œuvre.", rfr: "2 Corinthiens 9:8",
    en: "And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work.", ren: "2 Corinthians 9:8"
  },
  {
    fr: "C'est pourquoi je me plais dans les faiblesses... pour Christ ; car quand je suis faible, c'est alors que je suis fort.", rfr: "2 Corinthiens 12:10",
    en: "Therefore I take pleasure in infirmities... for Christ's sake: for when I am weak, then am I strong.", ren: "2 Corinthians 12:10"
  },
  {
    fr: "Ne vous y trompez pas : on ne se moque pas de Dieu. Ce qu'un homme aura semé, il le moissonnera aussi.", rfr: "Galates 6:7",
    en: "Be not deceived; God is not mocked: for whatsoever a man soweth, that shall he also reap.", ren: "Galates 6:7"
  },
  {
    fr: "Béni soit Dieu... qui nous a bénis de toutes sortes de bénédictions spirituelles dans les lieux célestes en Christ !", rfr: "Êphésiens 1:3",
    en: "Blessed be the God... who hath blessed us with all spiritual blessings in heavenly places in Christ.", ren: "Ephesians 1:3"
  },
  {
    fr: "Mais Dieu, qui est riche en miséricorde, à cause du grand amour dont il nous a aimés, nous a rendus à la vie avec Christ.", rfr: "Éphésiens 2:4-5",
    en: "But God, who is rich in mercy, for his great love wherewith he loved us, hath quickened us together with Christ.", ren: "Ephesians 2:4-5"
  },
  {
    fr: "En sorte que le Christ habite dans vos cœurs par la foi ; afin que, étant enracinés et fondés dans l'amour, vous puissiez comprendre...", rfr: "Éphésiens 3:17-18",
    en: "That Christ may dwell in your hearts by faith; that ye, being rooted and grounded in love, may be able to comprehend...", ren: "Ephesians 3:17-18"
  },
  {
    fr: "Je suis persuadé que celui qui a commencé en vous cette bonne œuvre la rendra parfaite pour le jour de Jésus-Christ.", rfr: "Philippiens 1:6",
    en: "Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ.", ren: "Philippians 1:6"
  },
  {
    fr: "Ce n'est pas en vue de mes besoins que je dis cela, car j'ai appris à être content de l'état où je me trouve.", rfr: "Philippiens 4:11",
    en: "Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content.", ren: "Philippians 4:11"
  },
  {
    fr: "Et que la paix de Christ, à laquelle vous avez été appelés pour former un seul corps, règne dans vos cœurs. Et soyez reconnaissants.", rfr: "Colossiens 3:15",
    en: "And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.", ren: "Colossians 3:15"
  },
  {
    fr: "Celui qui vous a appelés est fidèle, et c'est lui qui le fera.", rfr: "1 Thessaloniciens 5:24",
    en: "Faithful is he that calleth you, who also will do it.", ren: "1 Thessalonians 5:24"
  },
  {
    fr: "Le Seigneur me délivrera de toute œuvre mauvaise, et il me sauvera pour me faire entrer dans son royaume céleste.", rfr: "2 Timothée 4:18",
    en: "And the Lord shall deliver me from every evil work, and will preserve me unto his heavenly kingdom.", ren: "2 Timothy 4:18"
  },
  {
    fr: "Approchons-nous donc avec assurance du trône de la grâce, afin d'obtenir miséricorde et de trouver grâce, pour être secourus dans nos besoins.", rfr: "Hébreux 4:16",
    en: "Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", ren: "Hebrews 4:16"
  },
  {
    fr: "N'abandonnez donc pas votre assurance, à laquelle est attachée une grande rémunération.", rfr: "Hébreux 10:35",
    en: "Cast not away therefore your confidence, which hath great recompence of reward.", ren: "Hebrews 10:35"
  },
  {
    fr: "Ne vous livrez pas à l'amour de l'argent... car Dieu lui-même a dit : Je ne te délaisserai point, et je ne t'abandonnerai point.", rfr: "Hébreux 13:5",
    en: "Let your conversation be without covetousness... for he hath said, I will never leave thee, nor forsake thee.", ren: "Hebrews 13:5"
  },
  {
    fr: "Si quelqu'un d'entre vous manque de sagesse, qu'il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée.", rfr: "Jacques 1:5",
    en: "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", ren: "James 1:5"
  },
  {
    fr: "Soumettez-vous donc à Dieu ; résistez au diable, et il fuira loin de vous.", rfr: "Jacques 4:7",
    en: "Submit yourselves therefore to God. Resist the devil, and he will flee from you.", ren: "James 4:7"
  },
  {
    fr: "Humiliez-vous donc sous la puissante main de Dieu, afin qu'il vous élève au temps convenable.", rfr: "1 Pierre 5:6",
    en: "Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time.", ren: "1 Peter 5:6"
  },
{
    fr: "Que la grâce et la paix vous soient multipliées par la connaissance de Dieu et de Jésus notre Seigneur !", rfr: "2 Pierre 1:2",
    en: "Grace and peace be multiplied unto you through the knowledge of God, and of Jesus our Lord.", ren: "2 Peter 1:2"
  },
  {
    fr: "Si nous confessons nos péchés, il est fidèle et juste pour nous les pardonner, et pour nous purifier de toute iniquité.", rfr: "1 Jean 1:9",
    en: "If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.", ren: "1 John 1:9"
  },
  {
    fr: "Vous, petits enfants, vous êtes de Dieu, et vous les avez vaincus, parce que celui qui est en vous est plus grand que celui qui est dans le monde.", rfr: "1 Jean 4:4",
    en: "Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world.", ren: "1 John 4:4"
  },
  {
    fr: "Et nous, nous avons connu l'amour que Dieu a pour nous, et nous y avons cru. Dieu est amour ; et celui qui demeure dans l'amour demeure en Dieu, et Dieu demeure en lui.", rfr: "1 Jean 4:16",
    en: "And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him.", ren: "1 John 4:16"
  },
  {
    fr: "Pour nous, nous l'aimons, parce qu'il nous a aimés le premier.", rfr: "1 Jean 4:19",
    en: "We love him, because he first loved us.", ren: "1 John 4:19"
  },
  {
    fr: "Nous avons auprès de lui cette assurance, que si nous demandons quelque chose selon sa volonté, il nous écoute.", rfr: "1 Jean 5:14",
    en: "And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us.", ren: "1 John 5:14"
  },
  {
    fr: "Je suis l'alpha et l'oméga, dit le Seigneur Dieu, celui qui est, qui était, et qui vient, le Tout-Puissant.", rfr: "Apocalypse 1:8",
    en: "I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty.", ren: "Revelation 1:8"
  },
  {
    fr: "Parce que tu as gardé la parole de la persévérance en moi, je te garderai aussi à l'heure de la tentation qui va venir sur le monde entier.", rfr: "Apocalypse 3:10",
    en: "Because thou hast kept the word of my patience, I also will keep thee from the hour of temptation, which shall come upon all the world.", ren: "Revelation 3:10"
  },
  {
    fr: "Que la grâce du Seigneur Jésus soit avec vous tous ! Amen !", rfr: "Apocalypse 22:21",
    en: "The grace of our Lord Jesus Christ be with you all. Amen.", ren: "Revelation 22:21"
  },
  {
    fr: "Heureux l'homme qui ne marche pas selon le conseil des méchants... Mais qui trouve son plaisir dans la loi de l'Éternel !", rfr: "Psaume 1:1-2",
    en: "Blessed is the man that walketh not in the counsel of the ungodly... But his delight is in the law of the Lord.", ren: "Psalm 1:1-2"
  },
  {
    fr: "Il est comme un arbre planté près d'un courant d'eau, qui donne son fruit en sa saison, et dont le feuillage ne se flétrit point : tout ce qu'il fait lui réussit.", rfr: "Psaume 1:3",
    en: "And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper.", ren: "Psalm 1:3"
  },
  {
    fr: "Mais toi, ô Éternel ! tu es mon bouclier, tu es ma gloire, et tu relèves ma tête.", rfr: "Psaume 3:4",
    en: "But thou, O Lord, art a shield for me; my glory, and the lifter up of mine head.", ren: "Psalm 3:3"
  },
  {
    fr: "Je me couche et je m'endors en paix, car toi seul, ô Éternel ! tu me donnes la sécurité dans ma demeure.", rfr: "Psaume 4:9",
    en: "I will both lay me down in peace, and sleep: for thou, Lord, only makest me dwell in safety.", ren: "Psalm 4:8"
  },
  {
    fr: "Car tu bénis le juste, ô Éternel ! Tu l'entoures de ta grâce comme d'un bouclier.", rfr: "Psaume 5:13",
    en: "For thou, Lord, wilt bless the righteous; with favour wilt thou compass him as with a shield.", ren: "Psalm 5:12"
  },
  {
    fr: "J'ai constamment l'Éternel sous mes yeux ; quand il est à ma droite, je ne suis point ébranlé.", rfr: "Psaume 16:8",
    en: "I have set the Lord always before me: because he is at my right hand, I shall not be moved.", ren: "Psalm 16:8"
  },
  {
    fr: "Les voies de Dieu sont parfaites, la parole de l'Éternel est éprouvée ; il est un bouclier pour tous ceux qui se confient en lui.", rfr: "Psaume 18:31",
    en: "As for God, his way is perfect: the word of the Lord is tried: he is a buckler to all those that trust in him.", ren: "Psalm 18:30"
  },
  {
    fr: "Reçois favorablement les paroles de ma bouche et les sentiments de mon cœur, ô Éternel, mon rocher et my libérateur !", rfr: "Psaume 19:15",
    en: "Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O Lord, my strength, and my redeemer.", ren: "Psalm 19:14"
  },
  {
    fr: "Tous les sentiers de l'Éternel sont miséricorde et fidélité, pour ceux qui gardent son alliance et ses commandements.", rfr: "Psaume 25:10",
    en: "All the paths of the Lord are mercy and truth unto such as keep his covenant and his testimonies.", ren: "Psalm 25:10"
  },
  {
    fr: "Je demande à l'Éternel une chose, que je désire ardemment : je voudrais habiter toute ma vie dans la maison de l'Éternel.", rfr: "Psaume 27:4",
    en: "One thing have I desired of the Lord, that will I seek after; that I may dwell in the house of the Lord all the days of my life.", ren: "Psalm 27:4"
  },
  {
    fr: "Car il me protégera dans son tabernacle au jour du malheur, il me cachera sous l'abri de sa tente ; il m'élèvera sur un rocher.", rfr: "Psaume 27:5",
    en: "For in the time of trouble he shall hide me in his pavilion: in the secret of his tabernacle shall he hide me; he shall set me up upon a rock.", ren: "Psalm 27:5"
  },
  {
    fr: "L'Éternel est la force de son peuple, il est le rempart des délivrances de son oint.", rfr: "Psaume 28:8",
    en: "The Lord is their strength, and he is the saving strength of his anointed.", ren: "Psalm 28:8"
  },
  {
    fr: "Tu as changé mon deuil en allégresse, tu as délié mon sac, et tu m'as ceint de joie.", rfr: "Psaume 30:12",
    en: "Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with joy.", ren: "Psalm 30:11"
  },
  {
    fr: "Tu es un asile pour moi, tu me garantis de la détresse, tu m'entoures de chants de délivrance.", rfr: "Psaume 32:7",
    en: "Thou art my hiding place; thou shalt preserve me from trouble; thou shalt compass me about with songs of deliverance.", ren: "Psalm 32:7"
  },
  {
    fr: "Voici, l'œil de l'Éternel est sur ceux qui le craignent, sur ceux qui espèrent en sa bonté.", rfr: "Psaume 33:18",
    en: "Behold, the eye of the Lord is upon them that fear him, upon them that hope in his mercy.", ren: "Psalm 33:18"
  },
  {
    fr: "Éternel ! que ta bonté soit sur nous, comme nous avons espéré en toi !", rfr: "Psaume 33:22",
    en: "Let thy mercy, O Lord, be upon us, according as we hope in thee.", ren: "Psalm 33:22"
  },
  {
    fr: "Je bénirai l'Éternel en tout temps ; sa louange sera toujours dans ma bouche.", rfr: "Psaume 34:2",
    en: "I will bless the Lord at all times: his praise shall continually be in my mouth.", ren: "Psalm 34:1"
  },
  {
    fr: "Les lionceaux éprouvent de la disette et de la faim, mais ceux qui cherchent l'Éternel ne sont privés d'aucun bien.", rfr: "Psaume 34:11",
    en: "The young lions do lack, and suffer hunger: but they that seek the Lord shall not want any good thing.", ren: "Psalm 34:10"
  },
  {
    fr: "Les yeux de l'Éternel sont sur les justes, et ses oreilles sont attentives à leurs cris.", rfr: "Psaume 34:16",
    en: "The eyes of the Lord are upon the righteous, and his ears are open unto their cry.", ren: "Psalm 34:15"
  },
  {
    fr: "L'Éternel délivre l'âme de ses serviteurs, et tous ceux qui l'ont pour refuge échappent au châtiment.", rfr: "Psaume 34:23",
    en: "The Lord redeemeth the soul of his servants: and none of them that trust in him shall be desolate.", ren: "Psalm 34:22"
  },
  {
    fr: "Combien est précieuse ta bonté, ô Dieu ! À l'ombre de tes ailes les fils de l'homme cherchent un refuge.", rfr: "Psaume 36:8",
    en: "How excellent is thy lovingkindness, O God! therefore the children of men put their trust under the shadow of thy wings.", ren: "Psalm 36:7"
  },
  {
    fr: "Confie-toi en l'Éternel, et pratique le bien ; aie le pays pour demeure et la fidélité pour pâture.", rfr: "Psaume 37:3",
    en: "Trust in the Lord, and do good; so shalt thou dwell in the land, and verily thou shalt be fed.", ren: "Psalm 37:3"
  },
  {
    fr: "Il fera paraître ta justice comme la lumière, et ton droit comme le soleil à son midi.", rfr: "Psaume 37:6",
    en: "And he shall bring forth thy righteousness as the light, and thy judgment as the noonday.", ren: "Psalm 37:6"
  },
  {
    fr: "Garde le silence devant l'Éternel, et espère en lui.", rfr: "Psaume 37:7",
    en: "Rest in the Lord, and wait patiently for him.", ren: "Psalm 37:7"
  },
  {
    fr: "Les misérables possèdent le pays, et ils jouissent délicieusement d'une paix abondante.", rfr: "Psaume 37:11",
    en: "But the meek shall inherit the earth; and shall delight themselves in the abundance of peace.", ren: "Psalm 37:11"
  },
  {
    fr: "S'il tombe, il n'est pas terrassé, car l'Éternel lui prend la main.", rfr: "Psaume 37:24",
    en: "Though he fall, he shall not be utterly cast down: for the Lord upholdeth him with his hand.", ren: "Psalm 37:24"
  },
  {
    fr: "Le salut des justes vient de l'Éternel ; il est leur protecteur au temps de la détresse.", rfr: "Psaume 37:39",
    en: "But the salvation of the righteous is of the Lord: he is their strength in the time of trouble.", ren: "Psalm 37:39"
  },
  {
    fr: "J'avais mis en l'Éternel mon espérance ; et il s'est incliné vers moi, il a écouté mes cris.", rfr: "Psaume 40:2",
    en: "I waited patiently for the Lord; and he inclined unto me, and heard my cry.", ren: "Psalm 40:1"
  },
  {
    fr: "Il m'a retiré de la fosse de destruction... Il a dressé mes pieds sur le roc, il a affermi mes pas.", rfr: "Psaume 40:3",
    en: "He brought me up also out of an horrible pit... and set my feet upon a rock, and established my goings.", ren: "Psalm 40:2"
  },
  {
    fr: "Il a mis dans ma bouche un cantique nouveau, une louange à notre Dieu ; beaucoup l'ont vu, et ont eu de la crainte, et ils se sont confiés en l'Éternel.", rfr: "Psaume 40:4",
    en: "And he hath put a new song in my mouth, even praise unto our God: many shall see it, and fear, and shall trust in the Lord.", ren: "Psalm 40:3"
  },
  {
    fr: "Que tous ceux qui te cherchent soient dans l'allégresse et se réjouissent en toi ! Que ceux qui aiment ton salut disent sans cesse : Exalté soit l'Éternel !", rfr: "Psaume 40:17",
    en: "Let all those that seek thee rejoice and be glad in thee: let such as love thy salvation say continually, The Lord be magnified.", ren: "Psalm 40:16"
  },
  {
    fr: "Pourquoi t'abats-tu, mon âme, et gémis-tu au-dedans de moi ? Espère en Dieu, car je le louerai encore ; il est mon salut et mon Dieu.", rfr: "Psaume 42:6",
    en: "Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.", ren: "Psalm 42:5"
  },
  {
    fr: "Le jour, l'Éternel m'accordait sa grâce ; la nuit, son cantique était avec moi, prière au Dieu de ma vie.", rfr: "Psaume 42:9",
    en: "Yet the Lord will command his lovingkindness in the daytime, and in the night his song shall be with me, and my prayer unto the God of my life.", ren: "Psalm 42:8"
  },
  {
    fr: "Vous tous, peuples, battez des mains ! Poussez vers Dieu des cris de joie !", rfr: "Psaume 47:2",
    en: "O clap your hands, all ye people; shout unto God with the voice of triumph.", ren: "Psalm 47:1"
  },
  {
    fr: "Ô Dieu ! crée en moi un cœur pur, renouvelle en moi un esprit bien disposé.", rfr: "Psaume 51:12",
    en: "Create in me a clean heart, O God; and renew a right spirit within me.", ren: "Psalm 51:10"
  },
  {
    fr: "Rends-moi la joie de ton salut, et qu'un esprit de bonne volonté me soutienne !", rfr: "Psaume 51:14",
    en: "Restore unto me the joy of thy salvation; and uphold me with thy free spirit.", ren: "Psalm 51:12"
  },
  {
    fr: "Quand je suis dans la crainte, en toi je me confie.", rfr: "Psaume 56:4",
    en: "What time I am afraid, I will trust in thee.", ren: "Psalm 56:3"
  },
  {
    fr: "Je me confie en Dieu, je ne crains rien : que peuvent me faire des hommes ?", rfr: "Psaume 56:12",
    en: "In God have I put my trust: I will not be afraid what man can do unto me.", ren: "Psalm 56:11"
  },
  {
    fr: "Aie pitié de moi, ô Dieu !... Car en toi mon âme cherche un refuge ; je cherche un refuge à l'ombre de tes ailes, jusqu'à ce que les calamités soient passées.", rfr: "Psaume 57:2",
    en: "Be merciful unto me, O God... for my soul trusteth in thee: yea, in the shadow of thy wings will I make my refuge, until these calamities be overpast.", ren: "Psalm 57:1"
  },
  {
    fr: "Et moi, je chanterai ta force ; au matin, je célébrerai ta bonté. Car tu es pour moi une haute retraite, un refuge au jour de ma détresse.", rfr: "Psaume 59:17",
    en: "But I will sing of thy power; yea, I will sing aloud of thy mercy in the morning: for thou hast been my defence and refuge in the day of my trouble.", ren: "Psalm 59:16"
  },
  {
    fr: "Du bout de la terre je crie à toi, le cœur abattu ; conduis-moi sur le rocher que je ne puis atteindre !", rfr: "Psaume 61:3",
    en: "From the end of the earth will I cry unto thee, when my heart is overwhelmed: lead me to the rock that is higher than I.", ren: "Psalm 61:2"
  },
{
    fr: "Oui, c'est en Dieu que mon âme se confie ; de lui vient mon salut. Oui, c'est lui qui est mon rocher et mon salut ; ma haute retraite : je ne serai guère ébranlé.", rfr: "Psaume 62:2-3",
    en: "Truly my soul waiteth upon God: from him cometh my salvation. He only is my rock and my salvation; he is my defence; I shall not be greatly moved.", ren: "Psalm 62:1-2"
  },
  {
    fr: "Sur Dieu repose mon salut et ma gloire ; le rocher de ma force, mon refuge est en Dieu. En tout temps, peuples, confiez-vous en lui, répandez vos cœurs en sa présence !", rfr: "Psaume 62:8-9",
    en: "In God is my salvation and my glory: the rock of my strength, and my refuge, is in God. Trust in him at all times; ye people, pour out your heart before him.", ren: "Psalm 62:7-8"
  },
  {
    fr: "Car ta bonté vaut mieux que la vie : mes lèvres célèbrent tes louanges. Ainsi je te bénirai toute my vie, j'élèverai mes mains en ton nom.", rfr: "Psaume 63:4-5",
    en: "Because thy lovingkindness is better than life, my lips shall praise thee. Thus will I bless thee while I live: I will lift up my hands in thy name.", ren: "Psalm 63:3-4"
  },
  {
    fr: "Car tu es mon secours, et je suis dans l'allégresse à l'ombre de tes ailes. Mon âme est attachée à toi ; ta droite me soutient.", rfr: "Psaume 63:8-9",
    en: "Because thou hast been my help, therefore in the shadow of thy wings will I rejoice. My soul followeth hard after thee: thy right hand upholdeth me.", ren: "Psalm 63:7-8"
  },
  {
    fr: "Tu couronnes l'année de tes biens, et tes pas versent l'abondance ; les plaines du désert sont abreuvées, et les collines sont ceintes d'allégresse.", rfr: "Psaume 65:12-13",
    en: "Thou crownest the year with thy goodness; and thy paths drop fatness. They drop upon the pastures of the wilderness: and the little hills rejoice on every side.", ren: "Psalm 65:11-12"
  },
  {
    fr: "Béni soit le Seigneur chaque jour ! Quand on nous accable, Dieu nous délivre.", rfr: "Psaume 68:20",
    en: "Blessed be the Lord, who daily loadeth us with benefits, even the God of our salvation.", ren: "Psalm 68:19"
  },
  {
    fr: "Car tu es mon espérance, Seigneur Éternel ! En toi je me confie dès ma jeunesse.", rfr: "Psaume 71:5",
    en: "For thou art my hope, O Lord God: thou art my trust from my youth.", ren: "Psalm 71:5"
  },
  {
    fr: "Ma chair et mon cœur peuvent se consumer : Dieu est le rocher de mon cœur et ma portion pour toujours.", rfr: "Psaume 73:26",
    en: "My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.", ren: "Psalm 73:26"
  },
  {
    fr: "Heureux ceux qui placent en toi leur appui ! Ils trouvent dans leur cœur des chemins tout tracés. Lorsqu'ils traversent la vallée des larmes, ils la changent en un lieu plein de sources.", rfr: "Psaume 84:6-7",
    en: "Blessed is the man whose strength is in thee; in whose heart are the ways of them. Who passing through the valley of Baca make it a well.", ren: "Psalm 84:5-6"
  },
  {
    fr: "Leur force augmente pendant la marche, et ils se présentent devant Dieu à Sion.", rfr: "Psaume 84:8",
    en: "They go from strength to strength, every one of them in Zion appeareth before God.", ren: "Psalm 84:7"
  },
  {
    fr: "J'écouterai ce que dit Dieu, l'Éternel ; car il parle de paix à son peuple et à ses fidèles, pourvu qu'ils ne retombent pas dans la folie.", rfr: "Psaume 85:9",
    en: "I will hear what God the Lord will speak: for he will speak peace unto his people, and to his saints: but let them not turn again to folly.", ren: "Psalm 85:8"
  },
  {
    fr: "La bonté et la fidélité se rencontrent, la justice et la paix s'embrassent ; la fidélité germe de la terre, et la justice regarde du haut des cieux.", rfr: "Psaume 85:11-12",
    en: "Mercy and truth are met together; righteousness and peace have kissed each other. Truth shall spring out of the earth; and righteousness shall look down from heaven.", ren: "Psalm 85:10-11"
  },
  {
    fr: "L'Éternel donnera aussi le bonheur, et notre terre donnera ses fruits. La justice marchera devant lui, et imprimera ses pas sur le chemin.", rfr: "Psaume 85:13-14",
    en: "Yea, the Lord shall give that which is good; and our land shall yield her increase. Righteousness shall go before him; and shall set us in the way of his steps.", ren: "Psalm 85:12-13"
  },
  {
    fr: "Car tu es bon, Seigneur, tu pardonnes, tu es plein d'amour pour tous ceux qui t'invoquent.", rfr: "Psaume 86:5",
    en: "For thou, Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon thee.", ren: "Psalm 86:5"
  },
  {
    fr: "Au jour de ma détresse, je t'invoque, car tu me réponds.", rfr: "Psaume 86:7",
    en: "In the day of my trouble I will call upon thee: for thou wilt answer me.", ren: "Psalm 86:7"
  },
  {
    fr: "Mais toi, Seigneur, tu es un Dieu compatissant et miséricordieux, lent à la colère, riche en bonté et en fidélité.", rfr: "Psaume 86:15",
    en: "But thou, O Lord, art a God full of compassion, and gracious, longsuffering, and plenteous in mercy and truth.", ren: "Psalm 86:15"
  },
  {
    fr: "Je chanterai toujours les bontés de l'Éternel ; ma bouche fera connaître ta fidélité de génération en génération.", rfr: "Psaume 89:2",
    en: "I will sing of the mercies of the Lord for ever: with my mouth will I make known thy faithfulness to all generations.", ren: "Psalm 89:1"
  },
  {
    fr: "Heureux le peuple qui connaît les chants de joie ! Il marche à la lumière de ton visage, ô Éternel ! Il se réjouit sans cesse de ton nom, et il se glorifie de ta justice.", rfr: "Psaume 89:16-17",
    en: "Blessed is the people that know the joyful sound: they shall walk, O Lord, in the light of thy countenance. In thy name shall they rejoice all the day.", ren: "Psalm 89:15-16"
  },
  {
    fr: "Rassasie-nous chaque matin de ta bonté, et nous serons toute notre vie dans l'allégresse et la joie.", rfr: "Psaume 90:14",
    en: "O satisfy us early with thy mercy; that we may rejoice and be glad all our days.", ren: "Psalm 90:14"
  },
  {
    fr: "Je le rassasierai de longs jours, et je lui ferai voir mon salut.", rfr: "Psaume 91:16",
    en: "With long life will I satisfy him, and shew him my salvation.", ren: "Psalm 91:16"
  },
  {
    fr: "Il est beau de louer l'Éternel, et de célébrer ton nom, ô Très-Haut ! D'annoncer le matin ta bonté, et ta fidélité pendant les nuits.", rfr: "Psaume 92:2-3",
    en: "It is a good thing to give thanks unto the Lord, and to sing praises unto thy name, O most High: To shew forth thy lovingkindness in the morning, and thy faithfulness every night.", ren: "Psalm 92:1-2"
  },
  {
    fr: "Les justes croissent comme le palmier, ils s'élèvent comme le cèdre du Liban. Plantés dans la maison de l'Éternel, ils prospèrent dans les parvis de notre Dieu.", rfr: "Psaume 92:13-14",
    en: "The righteous shall flourish like the palm tree: he shall grow like a cedar in Lebanon. Those that be planted in the house of the Lord shall flourish in the courts of our God.", ren: "Psalm 92:12-13"
  },
  {
    fr: "Ils portent encore des fruits dans la vieillesse, ils sont pleins de sève et verdoyants, pour annoncer que l'Éternel est juste.", rfr: "Psaume 92:15-16",
    en: "They shall still bring forth fruit in old age; they shall be fat and flourishing; To shew that the Lord is upright.", ren: "Psalm 92:14-15"
  },
  {
    fr: "Quand je dis : Mon pied chancelle ! Ta bonté, ô Éternel ! me sert d'appui. Quand les pensées s'agitent en foule au-dedans de moi, tes consolations réjouissent mon âme.", rfr: "Psaume 94:18-19",
    en: "When I said, My foot slippeth; thy mercy, O Lord, held me up. In the multitude of my thoughts within me thy comforts delight my soul.", ren: "Psalm 94:18-19"
  },
  {
    fr: "Entrez dans ses portes avec des louanges, dans ses parvis avec des cantiques ! Célébrez-le, bénissez son nom ! Car l'Éternel est bon ; sa bonté dure toujours.", rfr: "Psaume 100:4-5",
    en: "Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name. For the Lord is good; his mercy is everlasting.", ren: "Psalm 100:4-5"
  },
  {
    fr: "Il est attentif à la prière du misérable, il ne dédaigne pas sa prière.", rfr: "Psaume 102:18",
    en: "He will regard the prayer of the destitute, and not despise their prayer.", ren: "Psalm 102:17"
  },
  {
    fr: "C'est lui qui délivre ta vie de la fosse, qui te couronne de bonté et de miséricorde ; c'est lui qui rassasie de biens ta vieillesse, qui te fait rajeunir comme l'aigle.", rfr: "Psaume 103:4-5",
    en: "Who redeemeth thy life from destruction; who crowneth thee with lovingkindness and tender mercies; Who satisfieth thy mouth with good things; so that thy youth is renewed like the eagle's.", ren: "Psalm 103:4-5"
  },
  {
    fr: "L'Éternel est miséricordieux et compatissant, lent à la colère et riche en bonté. Il ne conteste pas sans cesse, il ne garde pas sa colère à toujours.", rfr: "Psaume 103:8-9",
    en: "The Lord is merciful and gracious, slow to anger, and plenteous in mercy. He will not always chide: neither will he keep his anger for ever.", ren: "Psalm 103:8-9"
  },
  {
    fr: "Autant les cieux sont élevés au-dessus de la terre, autant sa bonté est grande pour ceux qui le craignent ; autant l'orient est éloigné de l'occident, autant il éloigne de nous nos transgressions.", rfr: "Psaume 103:11-12",
    en: "For as the heaven is high above the earth, so great is his mercy toward them that fear him. As far as the east is from the west, so far hath he removed our transgressions from us.", ren: "Psalm 103:11-12"
  },
  {
    fr: "Comme un père a compassion de ses enfants, l'Éternel a compassion de ceux qui le craignent. Car il sait de quoi nous sommes formés, il se souvient que nous sommes poussière.", rfr: "Psaume 103:13-14",
    en: "Like as a father pitieth his children, so the Lord pitieth them that fear him. For he knoweth our frame; he remembereth that we are dust.", ren: "Psalm 103:13-14"
  },
  {
    fr: "Louez l'Éternel ! Célébrez l'Éternel, car il est bon, car sa miséricorde dure à toujours !", rfr: "Psaume 107:1",
    en: "O give thanks unto the Lord, for he is good: for his mercy endureth for ever.", ren: "Psalm 107:1"
  },
  {
    fr: "Qu'ils louent l'Éternel pour sa bonté, et pour ses merveilles en faveur des fils de l'homme ! Car il a satisfait l'âme altérée, il a rempli de biens l'âme affamée.", rfr: "Psaume 107:8-9",
    en: "Oh that men would praise the Lord for his goodness, and for his wonderful works to the children of men! For he satisfieth the longing soul, and filleth the hungry soul with goodness.", ren: "Psalm 107:8-9"
  },
  {
    fr: "Il envoya sa parole et les guérit, il les fit échapper de la fosse.", rfr: "Psaume 107:20",
    en: "He sent his word, and healed them, and delivered them from their destructions.", ren: "Psalm 107:20"
  },
  {
    fr: "Il a laissé le souvenir de ses prodiges, l'Éternel est miséricordieux et compatissant. Il a donné de la nourriture à ceux qui le craignent ; il se souvient toujours de son alliance.", rfr: "Psaume 111:4-5",
    en: "He hath made his wonderful works to be remembered: the Lord is gracious and full of compassion. He hath given meat unto them that fear him; he will ever be mindful of his covenant.", ren: "Psalm 111:4-5"
  },
  {
    fr: "Louez l'Éternel ! Heureux l'homme qui craint l'Éternel, qui trouve un grand plaisir à ses commandements. La postérité sera puissante sur la terre, la génération des justes sera bénie.", rfr: "Psaume 112:1-2",
    en: "Praise ye the Lord. Blessed is the man that feareth the Lord, that delighteth greatly in his commandments. His seed shall be mighty upon earth: the generation of the upright shall be blessed.", ren: "Psalm 112:1-2"
  },
  {
    fr: "Il y a dans sa maison bien-être et richesse, et sa justice subsiste à jamais. La lumière se lève dans les ténèbres pour les hommes droits, pour celui qui est compatissant, miséricordieux et juste.", rfr: "Psaume 112:3-4",
    en: "Wealth and riches shall be in his house: and his righteousness endureth for ever. Unto the upright there ariseth light in the darkness: he is gracious, and full of compassion, and righteous.", ren: "Psalm 112:3-4"
  },
  {
    fr: "De la poussière il retire le pauvre, du fumier il relève le souffrant, pour les faire asseoir avec les grands, avec les grands de son peuple.", rfr: "Psaume 113:7-8",
    en: "He raiseth up the poor out of the dust, and lifteth the needy out of the dunghill; That he may set him with princes, even with the princes of his people.", ren: "Psalm 113:7-8"
  },
  {
    fr: "L'Éternel se souvient de nous : il bénira, il bénira la maison d'Israël, il bénira la maison d'Aaron, il bénira ceux qui craignent l'Éternel, les petits et les grands.", rfr: "Psaume 115:12-13",
    en: "The Lord hath been mindful of us: he will bless us; he will bless the house of Israel; he will bless the house of Aaron. He will bless them that fear the Lord, both small and great.", ren: "Psalm 115:12-13"
  },
  {
    fr: "L'Éternel vous multipliera ses faveurs, à vous et à vos enfants. Soyez bénis par l'Éternel, qui a fait les cieux et la terre !", rfr: "Psaume 115:14-15",
    en: "The Lord shall increase you more and more, you and your children. Ye are blessed of the Lord which made heaven and earth.", ren: "Psalm 115:14-15"
  },
  {
    fr: "Retourne, mon âme, à ton repos, car l'Éternel t'a fait du bien. Oui, tu as délivré mon âme de la mort, mes yeux des larmes, mes pieds de la chute.", rfr: "Psaume 116:7-8",
    en: "Return unto thy rest, O my soul; for the Lord hath dealt bountifully with thee. For thou hast delivered my soul from death, mine eyes from tears, and my feet from falling.", ren: "Psalm 116:7-8"
  },
  {
    fr: "Comment rendrai-je à l'Éternel tous ses bienfaits envers moi ? J'élèverai la coupe des délivrances, et j'invoquerai le nom de l'Éternel.", rfr: "Psaume 116:12-13",
    en: "What shall I render unto the Lord for all his benefits toward me? I will take the cup of salvation, and call upon the name of the Lord.", ren: "Psalm 116:12-13"
  },
  {
    fr: "L'Éternel est pour moi, je ne crains rien : que peuvent me faire des hommes ? L'Éternel est mon secours, et je regarde mes ennemis en face.", rfr: "Psaume 118:6-7",
    en: "The Lord is on my side; I will not fear: what can man do unto me? The Lord taketh my part with them that help me.", ren: "Psalm 118:6-7"
  },
  {
    fr: "Mieux vaut chercher un refuge en l'Éternel que de se confier à l'homme ; mieux vaut chercher un refuge en l'Éternel que de se confier aux grands.", rfr: "Psaume 118:8-9",
    en: "It is better to trust in the Lord than to put confidence in man. It is better to trust in the Lord than to put confidence in princes.", ren: "Psalm 118:8-9"
  },
  {
    fr: "L'Éternel est ma force et le sujet de mes louanges ; c'est lui qui m'a sauvé. Des cris de triomphe et de délivrance s'élèvent dans les tentes des justes : La droite de l'Éternel manifeste sa puissance !", rfr: "Psaume 118:14-15",
    en: "The Lord is my strength and song, and is become my salvation. The voice of rejoicing and salvation is in the tabernacles of the righteous: the right hand of the Lord doeth valiantly.", ren: "Psalm 118:14-15"
  },
  {
    fr: "Je ne mourrai pas, je vivrai, et je raconterai les œuvres de l'Éternel.", rfr: "Psaume 118:17",
    en: "I shall not die, but live, and declare the works of the Lord.", ren: "Psalm 118:17"
  },
  {
    fr: "C'est ici la maison de l'Éternel : c'est par elle que les justes entrent. Je te célèbre, parce que tu m'as exaucé, parce que tu m'as sauvé.", rfr: "Psaume 118:20-21",
    en: "This gate of the Lord, into which the righteous shall enter. I will praise thee: for thou hast heard me, and art become my salvation.", ren: "Psalm 118:20-21"
  },
  {
    fr: "La pierre qu'ont rejetée ceux qui bâtissaient est devenue la principale de l'angle. C'est de l'Éternel que cela est venu : c'est un prodige à nos yeux.", rfr: "Psaume 118:22-23",
    en: "The stone which the builders refused is become the head stone of the corner. This is the Lord's doing; it is marvellous in our eyes.", ren: "Psalm 118:22-23"
  },
  {
    fr: "C'est ma consolation dans ma misère : car ta parole me rend la vie.", rfr: "Psaume 119:50",
    en: "This is my comfort in my affliction: for thy word hath quickened me.", ren: "Psalm 119:50"
  },
  {
    fr: "Tu es mon asile et mon bouclier ; j'espère en ta parole.", rfr: "Psaume 119:114",
    en: "Thou art my hiding place and my shield: I hope in thy word.", ren: "Psalm 119:114"
  },
  {
    fr: "La révélation de tes paroles éclaire, elle donne de l'intelligence aux simples.", rfr: "Psaume 119:130",
    en: "The entrance of thy words giveth light; it giveth understanding unto the simple.", ren: "Psalm 119:130"
  },
{
    fr: "Il y a une grande paix pour ceux qui aiment ta loi, et il ne leur arrive aucun malheur.", rfr: "Psaume 119:165",
    en: "Great peace have they which love thy law: and nothing shall offend them.", ren: "Psalm 119:165"
  },
  {
    fr: "Je lève mes yeux vers les montagnes... Le secours me vient de l'Éternel, qui a fait les cieux et la terre.", rfr: "Psaume 121:1-2",
    en: "I will lift up mine eyes unto the hills... My help cometh from the Lord, which made heaven and earth.", ren: "Psalm 121:1-2"
  },
  {
    fr: "Pendant le jour le soleil ne te frappera point, ni la lune pendant la nuit.", rfr: "Psaume 121:6",
    en: "The sun shall not smite thee by day, nor the moon by night.", ren: "Psalm 121:6"
  },
  {
    fr: "Que la paix soit dans tes murs, et la tranquillité dans tes palais !", rfr: "Psaume 122:7",
    en: "Peace be within thy walls, and prosperity within thy palaces.", ren: "Psalm 122:7"
  },
  {
    fr: "L'Éternel a fait pour nous de grandes choses ; nous sommes dans la joie.", rfr: "Psaume 126:3",
    en: "The Lord hath done great things for us; whereof we are glad.", ren: "Psalm 126:3"
  },
  {
    fr: "En vain vous levez-vous matin, vous couchez-vous tard... Il en donne autant à ses bien-aimés pendant leur sommeil.", rfr: "Psaume 127:2",
    en: "It is vain for you to rise up early, to sit up late... for so he giveth his beloved sleep.", ren: "Psalm 127:2"
  },
  {
    fr: "Heureux tout homme qui craint l'Éternel, qui marche dans ses voies ! Tu jouis alors du travail de tes mains, tu es heureux, tu prospères.", rfr: "Psaume 128:1-2",
    en: "Blessed is every one that feareth the Lord; that walketh in his ways. For thou shalt eat the labour of thine hands: happy shalt thou be, and it shall be well with thee.", ren: "Psalm 128:1-2"
  },
  {
    fr: "J'espère en l'Éternel, mon âme espère, et j'attends sa promesse.", rfr: "Psaume 130:5",
    en: "I wait for the Lord, my soul doth wait, and in his word do I hope.", ren: "Psalm 130:5"
  },
  {
    fr: "Oh ! qu'il est agréable, qu'il est doux pour des frères de demeurer ensemble !", rfr: "Psaume 133:1",
    en: "Behold, how good and how pleasant it is for brethren to dwell together in unity!", ren: "Psalm 133:1"
  },
  {
    fr: "Car c'est là que l'Éternel envoie la bénédiction, la vie pour l'éternité.", rfr: "Psaume 133:3",
    en: "For there the Lord commanded the blessing, even life for evermore.", ren: "Psalm 133:3"
  },
  {
    fr: "Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours !", rfr: "Psaume 136:1",
    en: "O give thanks unto the Lord; for he is good: for his mercy endureth for ever.", ren: "Psalm 136:1"
  },
  {
    fr: "Où irais-je loin de ton esprit, et où fuirais-je loin de ta face ? Si je monte aux cieux, tu y es ; si je me couche au séjour des morts, te voilà.", rfr: "Psaume 139:7-8",
    en: "Whither shall I go from thy spirit? or whither shall I flee from thy presence? If I ascend up into heaven, thou art there.", ren: "Psalm 139:7-8"
  },
  {
    fr: "Que tes pensées, ô Dieu, me semblent précieuses ! Combien le nombre en est grand ! Si je les compte, elles sont plus nombreuses que les grains de sable.", rfr: "Psaume 139:17-18",
    en: "How precious also are thy thoughts unto me, O God! how great is the sum of them! If I should count them, they are more in number than the sand.", ren: "Psalm 139:17-18"
  },
  {
    fr: "Fais-moi dès le matin entendre ta bonté, car je me confie en toi ; fais-moi connaître le chemin où je dois marcher, car je lève mon âme à toi.", rfr: "Psaume 143:8",
    en: "Cause me to hear thy lovingkindness in the morning; for in thee do I trust: cause me to know the way wherein I should walk.", ren: "Psalm 143:8"
  },
  {
    fr: "L'Éternel soutient tous ceux qui tombent, et il redresse tous ceux qui sont courbés.", rfr: "Psaume 145:14",
    en: "The Lord upholdeth all that fall, and raiseth up all those that be bowed down.", ren: "Psalm 145:14"
  },
  {
    fr: "Tu ouvres ta main, et tu rassasies à souhait tout ce qui a vie.", rfr: "Psaume 145:16",
    en: "Thou openest thine hand, and satisfiest the desire of every living thing.", ren: "Psalm 145:16"
  },
  {
    fr: "Heureux celui qui a pour secours le Dieu de Jacob, qui met son espoir en l'Éternel, son Dieu !", rfr: "Psaume 146:5",
    en: "Happy is he that hath the God of Jacob for his help, whose hope is in the Lord his God.", ren: "Psalm 146:5"
  },
  {
    fr: "L'Éternel prend plaisir à ceux qui le craignent, à ceux qui espèrent en sa bonté.", rfr: "Psaume 147:11",
    en: "The Lord taketh pleasure in them that fear him, in those that hope in his mercy.", ren: "Psalm 147:11"
  },
  {
    fr: "Honore l'Éternel avec tes biens... Alors tes greniers seront remplis d'abondance, et tes cuves regorgeront de moût.", rfr: "Proverbes 3:9-10",
    en: "Honour the Lord with thy substance... So shall thy barns be filled with plenty, and thy presses shall burst out with new wine.", ren: "Proverbs 3:9-10"
  },
  {
    fr: "Si tu te couches, tu seras sans crainte ; et quand tu seras couché, ton sommeil sera doux.", rfr: "Proverbes 3:24",
    en: "When thou liest down, thou shalt not be afraid: yea, thou shalt lie down, and thy sleep shall be sweet.", ren: "Proverbs 3:24"
  },
  {
    fr: "C'est la bénédiction de l'Éternel qui enrichit, et il n'y joint aucune peine.", rfr: "Proverbes 10:22",
    en: "The blessing of the Lord, it maketh rich, and he addeth no sorrow with it.", ren: "Proverbs 10:22"
  },
  {
    fr: "Le cœur de l'homme médite sa voie, mais c'est l'Éternel qui affermit ses pas.", rfr: "Proverbes 16:9",
    en: "A man's heart deviseth his way: but the Lord directeth his steps.", ren: "Proverbs 16:9"
  },
  {
    fr: "Le nom de l'Éternel est une tour forte ; le juste y accourt, et s'y trouve en sûreté.", rfr: "Proverbes 18:10",
    en: "The name of the Lord is a strong tower: the righteous runneth into it, and is safe.", ren: "Proverbs 18:10"
  },
  {
    fr: "Car un enfant nous est né, un fils nous est donné, et la domination reposera sur son épaule ; on l'appellera Admirable, Conseiller, Dieu puissant, Père éternel, Prince de la paix.", rfr: "Ésaïe 9:5",
    en: "For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Prince of Peace.", ren: "Isaiah 9:6"
  },
  {
    fr: "Vous puiserez de l'eau avec joie aux sources du salut.", rfr: "Ésaïe 12:3",
    en: "Therefore with joy shall ye draw water out of the wells of salvation.", ren: "Isaiah 12:3"
  },
  {
    fr: "Il anéantit la mort pour toujours ; le Seigneur, l'Éternel, essuie les larmes de tous les visages.", rfr: "Ésaïe 25:8",
    en: "He will swallow up death in victory; and the Lord God will wipe away tears from off all faces.", ren: "Isaiah 25:8"
  },
  {
    fr: "L'œuvre de la justice sera la paix, et le fruit de la justice le repos et la sécurité pour toujours.", rfr: "Ésaïe 32:17",
    en: "And the work of righteousness shall be peace; and the effect of righteousness quietness and assurance for ever.", ren: "Isaiah 32:17"
  },
  {
    fr: "Les rachetés de l'Éternel retourneront... une joie éternelle couronnera leur tête ; l'allégresse et la joie s'approcheront, la douleur et les gémissements s'enfuiront.", rfr: "Ésaïe 35:10",
    en: "And the ransomed of the Lord shall return... everlasting joy upon their heads: they shall obtain joy and gladness, and sorrow and sighing shall flee away.", ren: "Isaiah 35:10"
  },
  {
    fr: "Comme un berger, il paîtra son troupeau, il prendra les agneaux dans ses bras, et les portera dans son sein.", rfr: "Ésaïe 40:11",
    en: "He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom.", ren: "Isaiah 40:11"
  },
  {
    fr: "Ne crains rien, vermisseau de Jacob... Je viens à ton secours, dit l'Éternel, et ton rédempteur est le Saint d'Israël.", rfr: "Ésaïe 41:14",
    en: "Fear not, thou worm Jacob... I will help thee, saith the Lord, and thy redeemer, the Holy One of Israel.", ren: "Isaiah 41:14"
  },
  {
    fr: "C'est moi, moi qui efface tes transgressions pour l'amour de moi, et je ne me souviendrai plus de tes péchés.", rfr: "Ésaïe 43:25",
    en: "I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.", ren: "Isaiah 43:25"
  },
  {
    fr: "Car je répandrai des eaux sur le sol altéré, et des ruisseaux sur la terre desséchée ; je répandrai mon esprit sur ta race, et ma bénédiction sur tes descendants.", rfr: "Ésaïe 44:3",
    en: "For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring.", ren: "Isaiah 44:3"
  },
  {
    fr: "Tournez-vous vers moi, et vous serez sauvés, vous tous qui êtes aux extrémités de la terre ! Car je suis Dieu, et il n'y en a point d'autre.", rfr: "Ésaïe 45:22",
    en: "Look unto me, and be ye saved, all the ends of the earth: for I am God, and there is none else.", ren: "Isaiah 45:22"
  },
  {
    fr: "Cieux, réjouissez-vous ! Terre, sois dans l'allégresse !... Car l'Éternel console son peuple, il a compassion de ses malheureux.", rfr: "Ésaïe 49:13",
    en: "Sing, O heavens; and be joyful, O earth... for the Lord hath comforted his people, and will have mercy upon his afflicted.", ren: "Isaiah 49:13"
  },
  {
    fr: "Mais il était blessé pour nos péchés, brisé pour nos iniquités ; le châtiment qui nous donne la paix est tombé sur lui, et c'est par ses meurtrissures que nous sommes guéris.", rfr: "Ésaïe 53:5",
    en: "But he was wounded for our transgressions, he was bruised for our iniquities: the chastiment of our peace was upon him; and with his stripes we are healed.", ren: "Isaiah 53:5"
  },
  {
    fr: "Vous tous qui avez soif, venez aux eaux, même celui qui n'a pas d'argent ! Venez, achetez et mangez.", rfr: "Ésaïe 55:1",
    en: "Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat.", ren: "Isaiah 55:1"
  },
  {
    fr: "Qu'il retourne à l'Éternel, qui aura pitié de lui, à notre Dieu, qui pardonne abondamment.", rfr: "Ésaïe 55:7",
    en: "Let him return unto the Lord, and he will have mercy upon him; and to our god, for he will abundantly pardon.", ren: "Isaiah 55:7"
  },
  {
    fr: "Alors ta lumière poindra comme l'aurore, et ta guérison germera promptement ; ta justice marchera devant toi, et la gloire de l'Éternel t'accompagnera.", rfr: "Ésaïe 58:8",
    en: "Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee.", ren: "Isaiah 58:8"
  },
  {
    fr: "Lève-toi, sois éclairée, car ta lumière arrive, et la gloire de l'Éternel se lève sur toi.", rfr: "Ésaïe 60:1",
    en: "Arise, shine; for thy light is come, and the glory of the Lord is risen upon thee.", ren: "Isaiah 60:1"
  },
  {
    fr: "L'esprit du Seigneur, l'Éternel, est sur moi, car l'Éternel m'a oint pour porter de bonnes nouvelles aux malheureux ; il m'a envoyé pour guérir ceux qui ont le cœur brisé.", rfr: "Ésaïe 61:1",
    en: "The Spirit of the Lord God is upon me; because the Lord hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted.", ren: "Isaiah 61:1"
  },
  {
    fr: "Pour leur donner un diadème au lieu de la cendre, une huile de joie au lieu du deuil, un vêtement de louange au lieu d'un esprit abattu.", rfr: "Ésaïe 61:3",
    en: "To give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness.", ren: "Isaiah 61:3"
  },
  {
    fr: "Guéris-moi, Éternel, et je serai guéri ; sauve-moi, et je serai sauvé ; car tu es ma louange.", rfr: "Jérémie 17:14",
    en: "Heal me, O Lord, and I shall be healed; save me, and I shall be saved: for thou art my praise.", ren: "Jeremiah 17:14"
  },
  {
    fr: "Je changerai leur deuil en allégresse, et je les consolerai ; je leur donnerai de la joie après leurs chagrins.", rfr: "Jérémie 31:13",
    en: "For I will turn their mourning into joy, and will comfort them, and make them rejoice from their sorrow.", ren: "Jeremiah 31:13"
  },
  {
    fr: "Je vous donnerai un cœur nouveau, et je mettrii en vous un esprit nouveau ; j'ôterai de votre corps le cœur de pierre, et je vous donnerai un cœur de chair.", rfr: "Ézéchiel 36:26",

// ─── TRADUCTIONS ET SÉCURITÉ DE TRADUCTION DE L'INTERFACE ─────────────────

  fr: {

    ob_label_name: 'First name',
